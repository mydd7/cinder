name: Verify
on:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify
      - if: runner.os == 'Linux'
        name: Configure Electron sandbox
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - if: runner.os != 'Linux'
        run: npm run smoke
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
      - if: runner.os == 'Windows'
        run: npm run smoke:large
      - if: runner.os == 'macOS'
        name: Build native macOS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
        run: npm run build:mac -- --$(node -p process.arch)
      - if: runner.os == 'macOS'
        run: npm run smoke:native
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
